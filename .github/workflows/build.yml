name: Build binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Build binary
        run: |
          pyinstaller --onefile --strip --clean --name secureXchange main.py
        shell: bash

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          name: secureXchange-${{ matrix.os }}
          files: dist/*
